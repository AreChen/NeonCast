name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Require a commit from main
        run: git merge-base --is-ancestor HEAD origin/main
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - name: Validate version, package runtime files and export release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/package.py --tag "$RELEASE_TAG" --notes-output "$RUNNER_TEMP/release-notes.md"
      - name: Upload assets to draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="dist/NeonCast-${version}.zip"
          kind=()
          latest=(--latest)
          if [[ "$version" == *-* ]]; then
            kind=(--prerelease)
            latest=(--latest=false)
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-is-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/release-is-draft")" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published. Publish changes under a new version."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" \
              --verify-tag --draft "${kind[@]}" \
              --title "NeonCast $version" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release edit "$RELEASE_TAG" --draft=false "${latest[@]}" \
            --title "NeonCast $version" --notes-file "$RUNNER_TEMP/release-notes.md"
